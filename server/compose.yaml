services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: checkqr
      POSTGRES_PASSWORD: checkqr_dev
      POSTGRES_DB: checkqr
    ports:
      - "5433:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkqr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos:
